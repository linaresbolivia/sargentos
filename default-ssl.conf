<IfModule mod_ssl.c>
	<VirtualHost *:443>
		ServerName sargentos.com.bo
		ServerAlias www.sargentos.com.bo
		ServerAdmin webmaster@localhost

		# === SARGENTOS FRONTEND (REACT / VITE DIST) ===
		DocumentRoot /var/www/sargentos/frontend/dist

		<Directory /var/www/sargentos/frontend/dist>
			Options -Indexes +FollowSymLinks
			AllowOverride All
			Require all granted

			# Soporte para React Router (SPA)
			RewriteEngine On
			RewriteBase /
			RewriteRule ^index\.html$ - [L]

			# Evitar reescribir recursos estáticos reales a index.html
			RewriteCond %{REQUEST_URI} \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ [NC]
			RewriteCond %{REQUEST_FILENAME} !-f
			RewriteRule ^ - [R=404,L]

			# Cualquier otra ruta que no sea archivo o carpeta existente va a index.html
			RewriteCond %{REQUEST_FILENAME} !-f
			RewriteCond %{REQUEST_FILENAME} !-d
			RewriteRule . /index.html [L]
		</Directory>
		# ===============================================

		# === SARGENTOS BACKEND API PROXY (NODE.JS :5000) ===
		<Location /api>
			ProxyPreserveHost On
			ProxyPass http://127.0.0.1:5000/api
			ProxyPassReverse http://127.0.0.1:5000/api
		</Location>

		# Proxy para archivos estáticos/subidas si el backend maneja /uploads
		<Location /uploads>
			ProxyPreserveHost On
			ProxyPass http://127.0.0.1:5000/uploads
			ProxyPassReverse http://127.0.0.1:5000/uploads
		</Location>
		# ====================================================

		ErrorLog ${APACHE_LOG_DIR}/sargentos_ssl_error.log
		CustomLog ${APACHE_LOG_DIR}/sargentos_ssl_access.log combined

		#   SSL Engine Switch:
		SSLEngine on

		# Certificados SSL por defecto (actualizar con tus certificados Let's Encrypt o corporativos)
		SSLCertificateFile	/etc/ssl/certs/ssl-cert-snakeoil.pem
		SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
		# Ejemplo con Let's Encrypt:
		# SSLCertificateFile /etc/letsencrypt/live/tudominio.com/fullchain.pem
		# SSLCertificateKeyFile /etc/letsencrypt/live/tudominio.com/privkey.pem

		<FilesMatch "\.(cgi|shtml|phtml|php)$">
				SSLOptions +StdEnvVars
		</FilesMatch>
		<Directory /usr/lib/cgi-bin>
				SSLOptions +StdEnvVars
		</Directory>

		# === SARGENTOS WEBSOCKETS / SOCKET.IO ===
		RewriteEngine On
		RewriteCond %{HTTP:Upgrade} =websocket [NC]
		RewriteRule ^/socket.io/(.*) ws://127.0.0.1:5000/socket.io/$1 [P,L]

		<Location /socket.io>
			ProxyPreserveHost On
			ProxyPass http://127.0.0.1:5000/socket.io
			ProxyPassReverse http://127.0.0.1:5000/socket.io
		</Location>
		# ========================================


	</VirtualHost>
</IfModule>
