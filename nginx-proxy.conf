# ==============================================================================
# CONFIGURACION NGINX PARA SARGENTOS.COM.BO (UBUNTU 20.04)
# Solucion definitiva para Error 413 (Request Entity Too Large)
# ==============================================================================

# OPCION 1 (RECOMENDADA GLOBAL): En /etc/nginx/nginx.conf dentro del bloque "http":
# http {
#     client_max_body_size 100M;
#     client_body_timeout 300s;
#     ...
# }

# OPCION 2: En el bloque "server" de tu sitio (/etc/nginx/sites-available/default o sargentos):
server {
    server_name sargentos.com.bo www.sargentos.com.bo;

    # ============================================================
    # 1. PERMITIR SUBIDAS DE ARCHIVOS GRANDES (HASTA 100 MB)
    # ============================================================
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # ============================================================
    # 2. TIMEOUTS EXTENDIDOS PARA ARCHIVOS DE 20 MB O MAS
    # ============================================================
    client_body_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # Proxy hacia Apache o Node:
    location / {
        proxy_pass http://127.0.0.1:80; # Ajustar al puerto donde escucha Apache
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Desactivar buffering para subidas continuas de archivos grandes
        proxy_request_buffering off;
    }
}
