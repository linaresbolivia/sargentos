<VirtualHost *:80>
	ServerName sargentos.com.bo
	ServerAlias www.sargentos.com.bo
	ServerAdmin webmaster@localhost

	# === SARGENTOS FRONTEND (REACT / VITE DIST) ===
	DocumentRoot /var/www/sargentos/frontend/dist

	<Directory /var/www/sargentos/frontend/dist>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted

		# Soporte para React Router (SPA)
		RewriteEngine On
		RewriteBase /
		RewriteRule ^index\.html$ - [L]

		# Evitar reescribir recursos estáticos reales a index.html
		RewriteCond %{REQUEST_URI} \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ [NC]
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteRule ^ - [R=404,L]

		# Cualquier otra ruta que no sea archivo o carpeta existente va a index.html
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteCond %{REQUEST_FILENAME} !-d
		RewriteRule . /index.html [L]
	</Directory>
	# ===============================================

	# === SARGENTOS BACKEND API PROXY (NODE.JS :5000) ===
	<Location /api>
		ProxyPreserveHost On
		ProxyPass http://127.0.0.1:5000/api
		ProxyPassReverse http://127.0.0.1:5000/api
	</Location>

	# Proxy para archivos estáticos/subidas si el backend maneja /uploads
	<Location /uploads>
		ProxyPreserveHost On
		ProxyPass http://127.0.0.1:5000/uploads
		ProxyPassReverse http://127.0.0.1:5000/uploads
	</Location>
	# ====================================================

	# Si deseas forzar redirección de HTTP a HTTPS una vez configurado el certificado SSL,
	# puedes descomentar las siguientes 3 líneas:
	# RewriteEngine On
	# RewriteCond %{HTTPS} off
	# RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

	ErrorLog ${APACHE_LOG_DIR}/sargentos_error.log
	CustomLog ${APACHE_LOG_DIR}/sargentos_access.log combined

	# === SARGENTOS WEBSOCKETS / SOCKET.IO ===
	RewriteEngine On
	RewriteCond %{HTTP:Upgrade} =websocket [NC]
	RewriteRule ^/socket.io/(.*) ws://127.0.0.1:5000/socket.io/$1 [P,L]

	<Location /socket.io>
		ProxyPreserveHost On
		ProxyPass http://127.0.0.1:5000/socket.io
		ProxyPassReverse http://127.0.0.1:5000/socket.io
	</Location>
	# ========================================

</VirtualHost>
